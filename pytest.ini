[pytest]
pythonpath = .
testpaths = tests src/specs
python_files = test_*.py
addopts = -ra --strict-markers --strict-config --tb=short
# Any new warning fails the run, so problems surface early
filterwarnings =
    error
# Hung browsers must not hang CI; slow specs override with @pytest.mark.timeout(...)
timeout = 60
# Live log is noisy for unit tests. Use `pytest -o log_cli=true src/specs` to watch a browser run.
log_cli = false
log_level = INFO
markers =
    unit: browserless unit tests for the web object / page objects (gate for e2e)
    e2e: test scenarios (src/specs)
    smoke: fast, critical-path scenarios (select with TWITCH_TAGS=smoke or -m smoke)
    regression: broader scenarios
